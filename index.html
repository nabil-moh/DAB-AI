<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>DAB AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --surface: #0b0b0b;
      --surface-2: #111111;
      --surface-3: #181818;
      --border: #292929;
      --text: #ffffff;
      --muted: #9ca3af;
      --user: #202020;
      --button: #222222;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: var(--bg);
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      height: 64px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #000000;
      color: #ffffff;
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo,
    .welcome-logo {
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 20px;
    }

    .brand h1 {
      font-size: 20px;
      color: #ffffff;
    }

    .brand span {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    /* =========================
       MENU
       ========================= */

    .menu-wrapper {
      position: relative;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
    }

    .menu-btn:active {
      background: #1f1f1f;
    }

    .menu {
      display: none;
      position: absolute;
      top: 48px;
      left: 0;
      width: 200px;
      background: #151515;
      color: #ffffff;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      z-index: 1000;
    }

    .menu.show {
      display: block;
    }

    .menu button {
      width: 100%;
      border: 0;
      background: #151515;
      color: #ffffff;
      padding: 15px;
      text-align: right;
      font-size: 15px;
      cursor: pointer;
    }

    .menu button:active {
      background: #252525;
    }

    /* =========================
       CHAT
       ========================= */

    .chat {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 14px 145px;
      scroll-behavior: smooth;
      background: #000000;
      -webkit-overflow-scrolling: touch;
    }

    .chat::-webkit-scrollbar {
      width: 5px;
    }

    .chat::-webkit-scrollbar-track {
      background: #000000;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #292929;
      border-radius: 10px;
    }

    /* =========================
       WELCOME
       ========================= */

    .welcome {
      text-align: center;
      padding: 55px 15px 20px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      margin: auto auto 18px;
      border-radius: 22px;
      font-size: 32px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
    }

    .welcome h2 {
      color: #ffffff;
      font-size: 26px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9ca3af;
      line-height: 1.8;
    }

    /* =========================
       MESSAGES
       ========================= */

    .message {
      display: flex;
      margin: 12px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid transparent;
    }

    .user .bubble {
      background: var(--user);
      color: #ffffff;
      border-color: #2d2d2d;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #ffffff;
      color: #000000;
      border-bottom-left-radius: 5px;
    }

    .message-image {
      display: block;
      max-width: 240px;
      max-height: 260px;
      margin-top: 8px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid #3a3a3a;
    }

    .message-file {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 9px 11px;
      background: #151515;
      border: 1px solid #363636;
      border-radius: 10px;
      font-size: 13px;
      color: #ffffff;
      word-break: break-word;
    }

    /* =========================
       ATTACHMENT PREVIEW
       ========================= */

    .attachment-preview {
      display: none;
      max-width: 850px;
      margin: 0 auto 8px;
      padding: 8px;
      border: 1px solid #303030;
      border-radius: 14px;
      background: #101010;
    }

    .attachment-preview.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .preview-image {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #333333;
      flex-shrink: 0;
    }

    .preview-file-icon {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      background: #202020;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      flex-shrink: 0;
    }

    .preview-info {
      flex: 1;
      min-width: 0;
    }

    .preview-name {
      color: #ffffff;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-size {
      color: #888888;
      font-size: 11px;
      margin-top: 4px;
    }

    .remove-attachment {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      background: #252525;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
    }

    /* =========================
       ATTACHMENT CHOOSER
       ========================= */

    .attachment-menu {
      display: none;
      position: absolute;
      bottom: 70px;
      right: 12px;
      width: 190px;
      background: #151515;
      border: 1px solid #333333;
      border-radius: 15px;
      padding: 6px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      z-index: 900;
    }

    .attachment-menu.show {
      display: block;
    }

    .attachment-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #ffffff;
      padding: 13px 12px;
      text-align: right;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .attachment-menu button:active {
      background: #252525;
    }

    /* =========================
       INPUT AREA
       ========================= */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 900px;
      padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.97);
      border-top: 1px solid var(--border);
      z-index: 500;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 850px;
      margin: auto;
      padding: 6px;
      border: 1px solid #303030;
      border-radius: 18px;
      background: #101010;
      position: relative;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      font-size: 16px;
      padding: 10px;
      background: transparent;
      color: #ffffff;
      direction: rtl;
    }

    #messageInput::placeholder {
      color: #777777;
    }

    /* =========================
       BUTTONS
       ========================= */

    .icon-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--button);
      color: #ffffff;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .send-btn {
      background: #ffffff;
      color: #000000;
    }

    .mic-btn.recording {
      background: #ffffff;
      color: #000000;
      animation: micPulse 1.1s infinite;
    }

    @keyframes micPulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
      100% {
        transform: scale(1);
      }
    }

    /* =========================
       STATUS
       ========================= */

    .status {
      text-align: center;
      font-size: 12px;
      color: #8b8b8b;
      min-height: 18px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .status.active {
      color: #ffffff;
    }

    .status.error {
      color: #bbbbbb;
    }

    /* =========================
       HIDDEN INPUTS
       ========================= */

    .hidden-file-input {
      display: none;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {
      .header {
        height: 60px;
        min-height: 60px;
      }

      .chat {
        padding-top: 10px;
      }

      .welcome {
        padding-top: 40px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .bubble {
        max-width: 88%;
      }

      .brand h1 {
        font-size: 18px;
      }

      .brand span {
        font-size: 10px;
      }

      .message-image {
        max-width: 210px;
        max-height: 230px;
      }

      .input-box {
        gap: 5px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
      }

      #messageInput {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="brand">

      <div class="logo">D</div>

      <div>
        <h1>DAB AI</h1>
        <span>مساعدك الذكي</span>
      </div>

    </div>

    <div class="menu-wrapper">

      <button
        class="menu-btn"
        id="menuBtn"
        type="button"
        aria-label="القائمة">
        ⋮
      </button>

      <div
        class="menu"
        id="menu">

        <button
          type="button"
          id="newChatBtn">
          🆕 محادثة جديدة
        </button>

        <button
          type="button"
          id="closeMenuBtn">
          ✕ إغلاق القائمة
        </button>

      </div>

    </div>

  </header>


  <!-- CHAT -->
  <main
    class="chat"
    id="chat">

    <div
      class="welcome"
      id="welcome">

      <div class="welcome-logo">D</div>

      <h2>
        مرحبًا بك في DAB AI
      </h2>

      <p>
        مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
        اكتب رسالتك أو استخدم الميكروفون أو أرسل صورة أو ملف.
      </p>

    </div>

  </main>


  <!-- INPUT AREA -->
  <div class="input-area">

    <!-- قائمة الإرفاق -->
    <div
      class="attachment-menu"
      id="attachmentMenu">

      <button
        type="button"
        id="chooseImageBtn">
        🖼️ إضافة صورة
      </button>

      <button
        type="button"
        id="chooseFileBtn">
        📄 إضافة ملف
      </button>

      <button
        type="button"
        id="cancelAttachmentBtn">
        ✕ إلغاء
      </button>

    </div>


    <!-- معاينة المرفق -->
    <div
      class="attachment-preview"
      id="attachmentPreview">

      <div id="previewVisual"></div>

      <div class="preview-info">

        <div
          class="preview-name"
          id="previewName">
        </div>

        <div
          class="preview-size"
          id="previewSize">
        </div>

      </div>

      <button
        class="remove-attachment"
        id="removeAttachmentBtn"
        type="button"
        aria-label="إزالة المرفق">
        ✕
      </button>

    </div>


    <div class="input-box">

      <!-- زر الإرفاق -->
      <button
        class="icon-btn attach-btn"
        id="attachBtn"
        type="button"
        aria-label="إرفاق صورة أو ملف">
        📎
      </button>


      <!-- صورة -->
      <input
        class="hidden-file-input"
        id="imageInput"
        type="file"
        accept="image/*">


      <!-- ملفات -->
      <input
        class="hidden-file-input"
        id="fileInput"
        type="file"
        accept=".pdf,.txt,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.json,.zip,.jpg,.jpeg,.png">


      <!-- ميكروفون -->
      <button
        class="icon-btn mic-btn"
        id="micBtn"
        type="button"
        aria-label="تسجيل صوتي">
        🎙️
      </button>


      <!-- النص -->
      <input
        id="messageInput"
        type="text"
        placeholder="اكتب رسالتك..."
        autocomplete="off"
        enterkeyhint="send">


      <!-- إرسال -->
      <button
        class="icon-btn send-btn"
        id="sendBtn"
        type="button"
        aria-label="إرسال">
        ➤
      </button>

    </div>


    <div
      class="status"
      id="status"
      aria-live="polite">
    </div>

  </div>

</div>


<script>
"use strict";

/* =====================================================
   DAB AI
   إصلاح الميكروفون + الصور + الملفات
   ===================================================== */


/* =====================================================
   العناصر
   ===================================================== */

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");

const micBtn = document.getElementById("micBtn");
const sendBtn = document.getElementById("sendBtn");

const attachBtn = document.getElementById("attachBtn");

const imageInput = document.getElementById("imageInput");
const fileInput = document.getElementById("fileInput");

const attachmentMenu =
  document.getElementById("attachmentMenu");

const chooseImageBtn =
  document.getElementById("chooseImageBtn");

const chooseFileBtn =
  document.getElementById("chooseFileBtn");

const cancelAttachmentBtn =
  document.getElementById("cancelAttachmentBtn");

const attachmentPreview =
  document.getElementById("attachmentPreview");

const previewVisual =
  document.getElementById("previewVisual");

const previewName =
  document.getElementById("previewName");

const previewSize =
  document.getElementById("previewSize");

const removeAttachmentBtn =
  document.getElementById("removeAttachmentBtn");

const menuBtn =
  document.getElementById("menuBtn");

const menu =
  document.getElementById("menu");

const newChatBtn =
  document.getElementById("newChatBtn");

const closeMenuBtn =
  document.getElementById("closeMenuBtn");

const status =
  document.getElementById("status");


/* =====================================================
   المتغيرات
   ===================================================== */

let recording = false;
let speechPlugin = null;
let selectedAttachment = null;
let partialSpeechText = "";


/* =====================================================
   الحالة
   ===================================================== */

function setStatus(message, type = "") {

  if (!status) return;

  status.textContent = message || "";

  status.classList.remove(
    "active",
    "error"
  );

  if (type) {
    status.classList.add(type);
  }
}


/* =====================================================
   حجم الملف
   ===================================================== */

function formatFileSize(bytes) {

  if (!bytes) {
    return "0 بايت";
  }

  if (bytes < 1024) {
    return bytes + " بايت";
  }

  if (bytes < 1024 * 1024) {
    return (bytes / 1024).toFixed(1) + " KB";
  }

  if (bytes < 1024 * 1024 * 1024) {
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB";
}


/* =====================================================
   قائمة الإرفاق
   ===================================================== */

attachBtn.addEventListener("click", function(event) {

  event.stopPropagation();

  attachmentMenu.classList.toggle("show");

});


chooseImageBtn.addEventListener("click", function() {

  attachmentMenu.classList.remove("show");

  imageInput.value = "";

  imageInput.click();

});


chooseFileBtn.addEventListener("click", function() {

  attachmentMenu.classList.remove("show");

  fileInput.value = "";

  fileInput.click();

});


cancelAttachmentBtn.addEventListener("click", function() {

  attachmentMenu.classList.remove("show");

});


document.addEventListener("click", function(event) {

  if (
    !event.target.closest(".input-box") &&
    !event.target.closest(".attachment-menu")
  ) {
    attachmentMenu.classList.remove("show");
  }

});


/* =====================================================
   الصورة
   ===================================================== */

imageInput.addEventListener("change", function() {

  const file =
    imageInput.files &&
    imageInput.files[0];

  if (!file) {
    return;
  }

  if (!file.type.startsWith("image/")) {

    setStatus(
      "الملف المختار ليس صورة.",
      "error"
    );

    imageInput.value = "";

    return;
  }

  setAttachment(file);

});


/* =====================================================
   الملف
   ===================================================== */

fileInput.addEventListener("change", function() {

  const file =
    fileInput.files &&
    fileInput.files[0];

  if (!file) {
    return;
  }

  setAttachment(file);

});


/* =====================================================
   حفظ المرفق وعرضه
   ===================================================== */

function setAttachment(file) {

  selectedAttachment = file;

  previewVisual.innerHTML = "";

  previewName.textContent =
    file.name;

  previewSize.textContent =
    formatFileSize(file.size);

  attachmentPreview.classList.add("show");


  if (
    file.type &&
    file.type.startsWith("image/")
  ) {

    const img =
      document.createElement("img");

    img.className = "preview-image";

    img.alt = "معاينة الصورة";

    img.src =
      URL.createObjectURL(file);

    previewVisual.appendChild(img);

  } else {

    const icon =
      document.createElement("div");

    icon.className =
      "preview-file-icon";

    icon.textContent = "📄";

    previewVisual.appendChild(icon);

  }


  setStatus(
    "تمت إضافة: " + file.name,
    "active"
  );

}


/* =====================================================
   إزالة المرفق
   ===================================================== */

removeAttachmentBtn.addEventListener(
  "click",
  removeAttachment
);


function removeAttachment() {

  selectedAttachment = null;

  imageInput.value = "";
  fileInput.value = "";

  previewVisual.innerHTML = "";

  previewName.textContent = "";
  previewSize.textContent = "";

  attachmentPreview.classList.remove("show");

}


/* =====================================================
   تحميل إضافة التعرف على الصوت
   ===================================================== */

function loadSpeechPlugin() {

  try {

    if (
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.SpeechRecognition
    ) {

      speechPlugin =
        window.Capacitor.Plugins.SpeechRecognition;

      console.log(
        "SpeechRecognition plugin found."
      );

      return speechPlugin;
    }

  } catch (error) {

    console.error(
      "Speech plugin error:",
      error
    );

  }

  return null;
}


function ensureSpeechPlugin() {

  if (speechPlugin) {
    return speechPlugin;
  }

  return loadSpeechPlugin();
}


/* =====================================================
   صلاحيات الميكروفون
   ===================================================== */

async function checkMicrophonePermission(plugin) {

  try {

    if (
      typeof plugin.requestPermissions ===
      "function"
    ) {

      await plugin.requestPermissions();

    }

    if (
      typeof plugin.checkPermissions ===
      "function"
    ) {

      const permissions =
        await plugin.checkPermissions();

      console.log(
        "Speech permissions:",
        permissions
      );

      if (
        permissions &&
        permissions.speechRecognition ===
        "denied"
      ) {

        return false;
      }
    }

    return true;

  } catch (error) {

    console.error(
      "Permission error:",
      error
    );

    return false;
  }
}


/* =====================================================
   رسالة أخطاء الصوت
   ===================================================== */

function getSpeechErrorMessage(error) {

  const value =
    error &&
    (
      error.code ||
      error.message ||
      error.error
    );

  const text =
    String(value || "").toLowerCase();


  if (
    text.includes("permission") ||
    text.includes("denied") ||
    text.includes("not allowed")
  ) {

    return (
      "الميكروفون غير مسموح به. " +
      "اسمح للتطبيق باستخدام الميكروفون من إعدادات الهاتف."
    );

  }


  if (text.includes("network")) {

    return (
      "تعذر الاتصال بخدمة التعرف على الكلام. " +
      "تأكد من اتصال الإنترنت."
    );

  }


  if (text.includes("language")) {

    return (
      "لغة التعرف على الكلام غير متاحة على هذا الجهاز."
    );

  }


  return (
    "تعذر تشغيل التعرف على الكلام. " +
    "تأكد من صلاحية الميكروفون ثم حاول مرة أخرى."
  );

}


/* =====================================================
   التقاط النتائج الجزئية
   ===================================================== */

function setupSpeechListeners(plugin) {

  if (!plugin) {
    return;
  }

  try {

    if (
      typeof plugin.addListener ===
      "function"
    ) {

      plugin.addListener(
        "partialResults",
        function(data) {

          console.log(
            "Partial speech result:",
            data
          );

          let text = "";

          if (
            data &&
            Array.isArray(data.matches) &&
            data.matches.length
          ) {

            text =
              String(
                data.matches[0] || ""
              ).trim();

          } else if (
            data &&
            typeof data.transcript === "string"
          ) {

            text =
              data.transcript.trim();

          } else if (
            data &&
            typeof data.text === "string"
          ) {

            text =
              data.text.trim();

          }


          if (text) {

            partialSpeechText = text;

            input.value = text;

            setStatus(
              "🎙️ " + text,
              "active"
            );

          }

        }
      );

    }

  } catch (error) {

    console.error(
      "Speech listener error:",
      error
    );

  }

}


/* =====================================================
   بدء التسجيل
   ===================================================== */

async function startRecording() {

  const plugin =
    ensureSpeechPlugin();


  if (!plugin) {

    setStatus(
      "إضافة التعرف على الصوت غير موجودة داخل التطبيق.",
      "error"
    );

    return;
  }


  if (recording) {
    return;
  }


  try {

    setStatus(
      "جاري تشغيل الميكروفون...",
      "active"
    );


    const permission =
      await checkMicrophonePermission(
        plugin
      );


    if (!permission) {

      setStatus(
        "اسمح للتطبيق باستخدام الميكروفون من إعدادات الهاتف.",
        "error"
      );

      return;
    }


    recording = true;
    partialSpeechText = "";


    micBtn.classList.add("recording");

    micBtn.textContent = "⏹️";

    micBtn.setAttribute(
      "aria-label",
      "إيقاف التسجيل"
    );


    setStatus(
      "🎙️ استمع إليك الآن... تحدث بوضوح.",
      "active"
    );


    /*
     * بعض إصدارات الإضافة تستخدم start()
     * لإرجاع النتيجة النهائية.
     *
     * نستخدم partialResults كذلك حتى يظهر الكلام
     * أثناء التحدث.
     */

    const result =
      await plugin.start({

        language: "ar-DZ",

        maxResults: 5,

        partialResults: true,

        popup: false

      });


    console.log(
      "Final speech result:",
      result
    );


    let recognizedText = "";


    if (
      result &&
      Array.isArray(result.matches) &&
      result.matches.length > 0
    ) {

      recognizedText =
        String(
          result.matches[0] || ""
        ).trim();

    } else if (
      result &&
      typeof result.transcript === "string"
    ) {

      recognizedText =
        result.transcript.trim();

    } else if (
      result &&
      typeof result.text === "string"
    ) {

      recognizedText =
        result.text.trim();

    }


    /*
     * إذا لم تصل النتيجة النهائية،
     * نستخدم آخر نتيجة جزئية.
     */

    if (!recognizedText) {

      recognizedText =
        partialSpeechText.trim();

    }


    if (recognizedText) {

      input.value =
        recognizedText;

      setStatus(
        "✓ تم التعرف على كلامك.",
        "active"
      );

      input.focus();

    } else {

      setStatus(
        "لم يصل نص من التعرف على الكلام. تحدث بوضوح وحاول مرة أخرى.",
        "error"
      );

    }


  } catch (error) {

    console.error(
      "Speech recognition error:",
      error
    );

    setStatus(
      getSpeechErrorMessage(error),
      "error"
    );

  } finally {

    recording = false;

    micBtn.classList.remove("recording");

    micBtn.textContent = "🎙️";

    micBtn.setAttribute(
      "aria-label",
      "تسجيل صوتي"
    );

  }

}


/* =====================================================
   إيقاف التسجيل
   ===================================================== */

async function stopRecording() {

  try {

    const plugin =
      speechPlugin ||
      ensureSpeechPlugin();


    if (
      plugin &&
      typeof plugin.stop ===
      "function"
    ) {

      await plugin.stop();

    }

  } catch (error) {

    console.log(
      "Speech stop error:",
      error
    );

  }


  recording = false;

  micBtn.classList.remove("recording");

  micBtn.textContent = "🎙️";

  micBtn.setAttribute(
    "aria-label",
    "تسجيل صوتي"
  );

}


/* =====================================================
   زر الميكروفون
   ===================================================== */

micBtn.addEventListener(
  "click",
  async function() {

    if (recording) {

      await stopRecording();

    } else {

      await startRecording();

    }

  }
);


/* =====================================================
   إرسال الرسالة
   ===================================================== */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  }
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


function sendMessage() {

  const text =
    input.value.trim();


  if (
    !text &&
    !selectedAttachment
  ) {

    return;
  }


  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }


  addMessage(
    text,
    "user",
    selectedAttachment
  );


  input.value = "";

  removeAttachment();

  setStatus(
    "جاري تجهيز الرد...",
    "active"
  );


  /*
   * الربط الحقيقي مع Gemini سيتم في طبقة API/Backend.
   * لا يتم وضع GEMINI_API_KEY داخل index.html.
   */

  setTimeout(
    function() {

      addMessage(
        "تم استلام رسالتك والمرفق بنجاح. 🤖",
        "ai"
      );

      setStatus("");

    },
    500
  );

}


/* =====================================================
   إضافة رسالة
   ===================================================== */

function addMessage(
  text,
  type,
  attachment = null
) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if (text) {

    const textElement =
      document.createElement("div");

    textElement.textContent =
      text;

    bubble.appendChild(
      textElement
    );

  }


  /*
   * صورة
   */

  if (
    attachment &&
    attachment.type &&
    attachment.type.startsWith("image/")
  ) {

    const img =
      document.createElement("img");

    img.className =
      "message-image";

    img.alt =
      attachment.name;

    img.src =
      URL.createObjectURL(
        attachment
      );

    bubble.appendChild(
      img
    );

  }


  /*
   * ملف
   */

  else if (attachment) {

    const fileBox =
      document.createElement("div");

    fileBox.className =
      "message-file";

    fileBox.textContent =
      "📎 " +
      attachment.name +
      " (" +
      formatFileSize(
        attachment.size
      ) +
      ")";

    bubble.appendChild(
      fileBox
    );

  }


  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );


  requestAnimationFrame(
    function() {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =====================================================
   محادثة جديدة
   ===================================================== */

function newChat() {

  stopRecording();

  removeAttachment();

  chat.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="welcome-logo">D</div>

      <h2>
        مرحبًا بك في DAB AI
      </h2>

      <p>
        مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
        اكتب رسالتك أو استخدم الميكروفون أو أرسل صورة أو ملف.
      </p>

    </div>
  `;

  input.value = "";

  setStatus("");

  menu.classList.remove("show");

  attachmentMenu.classList.remove("show");

  setTimeout(
    function() {
      input.focus();
    },
    100
  );

}


newChatBtn.addEventListener(
  "click",
  newChat
);


/* =====================================================
   القائمة
   ===================================================== */

menuBtn.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    menu.classList.toggle("show");

  }
);


closeMenuBtn.addEventListener(
  "click",
  function() {

    menu.classList.remove("show");

  }
);


document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".menu-wrapper"
      )
    ) {

      menu.classList.remove("show");

    }

  }
);


/* =====================================================
   تشغيل الإضافة عند فتح التطبيق
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const plugin =
      loadSpeechPlugin();

    if (plugin) {
      setupSpeechListeners(plugin);
    }

    setStatus("");

  }
);


/* =====================================================
   أخطاء عامة
   ===================================================== */

window.addEventListener(
  "error",
  function(event) {

    console.error(
      "DAB AI error:",
      event.error || event.message
    );

  }
);

</script>
