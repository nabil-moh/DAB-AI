<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>DAB AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: white;
    }

    /* الرأس */
    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #111827;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: white;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand span {
      display: block;
      font-size: 11px;
      opacity: .7;
      margin-top: 2px;
    }

    .menu-btn {
      border: 0;
      background: transparent;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    /* المحادثة */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 110px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 55px 15px 20px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      margin: auto auto 18px;
      border-radius: 22px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #6b7280;
      line-height: 1.7;
    }

    .message {
      display: flex;
      margin: 12px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #e5e7eb;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #111827;
      color: white;
      border-bottom-left-radius: 5px;
    }

    /* منطقة الكتابة */
    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 900px;
      padding: 10px 12px 14px;
      background: rgba(255,255,255,.96);
      border-top: 1px solid #e5e7eb;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 850px;
      margin: auto;
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 18px;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 16px;
      padding: 10px;
      background: transparent;
      min-width: 0;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
    }

    .send-btn {
      background: #111827;
      color: white;
    }

    .mic-btn.recording {
      background: #dc2626;
      color: white;
    }

    /* الهاتف */
    @media (max-width: 600px) {
      .header {
        height: 60px;
      }

      .chat {
        padding-top: 10px;
      }

      .welcome {
        padding-top: 40px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">D</div>
      <div>
        <h1>DAB AI</h1>
        <span>مساعدك الذكي</span>
      </div>
    </div>

    <button class="menu-btn" onclick="newChat()" aria-label="محادثة جديدة">
      ⋮
    </button>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <div class="welcome-logo">D</div>
      <h2>مرحبًا بك في DAB AI</h2>
      <p>
        مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
        اكتب رسالتك أو استخدم الميكروفون.
      </p>
    </div>

  </main>

  <div class="input-area">
    <div class="input-box">

      <button
        class="icon-btn mic-btn"
        id="micBtn"
        onclick="toggleRecording()"
        aria-label="تسجيل صوتي">
        🎙️
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="اكتب رسالتك..."
        autocomplete="off"
      >

      <button
        class="icon-btn send-btn"
        onclick="sendMessage()"
        aria-label="إرسال">
        ➤
      </button>

    </div>
  </div>

</div>

<script>
  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const micBtn = document.getElementById("micBtn");

  let recognition = null;
  let recording = false;

  // إرسال بالضغط على Enter
  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });

  function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    const welcome = document.getElementById("welcome");
    if (welcome) {
      welcome.remove();
    }

    addMessage(text, "user");

    input.value = "";

    // رد تجريبي مؤقت
    setTimeout(() => {
      addMessage(
        "مرحبًا! أنا DAB AI 🤖\nتم استلام رسالتك بنجاح. سنربطني لاحقًا بمحرك الذكاء الاصطناعي الحقيقي.",
        "ai"
      );
    }, 500);
  }

  function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }

  // محادثة جديدة
  function newChat() {
    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-logo">D</div>
        <h2>مرحبًا بك في DAB AI</h2>
        <p>
          مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
          اكتب رسالتك أو استخدم الميكروفون.
        </p>
      </div>
    `;

    input.value = "";
    input.focus();
  }

  // التسجيل الصوتي
  function toggleRecording() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("التعرف على الصوت غير مدعوم في هذا المتصفح.");
      return;
    }

    if (recording) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "ar-DZ";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = function() {
      recording = true;
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹️";
    };

    recognition.onresult = function(event) {

      let text = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {
        text += event.results[i][0].transcript;
      }

      input.value = text;
    };

    recognition.onend = function() {
      recording = false;
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎙️";
    };

    recognition.onerror = function() {
      recording = false;
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎙️";
    };

    recognition.start();
  }
</script>

</body>
</html>
