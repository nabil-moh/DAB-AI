<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>DAB AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: white;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #111827;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: white;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand span {
      display: block;
      font-size: 11px;
      opacity: .7;
      margin-top: 2px;
    }

    .menu-wrapper {
      position: relative;
    }

    .menu-btn {
      border: 0;
      background: transparent;
      color: white;
      font-size: 24px;
      cursor: pointer;
      width: 42px;
      height: 42px;
      border-radius: 50%;
    }

    .menu-btn:active {
      background: rgba(255,255,255,.12);
    }

    .menu {
      display: none;
      position: absolute;
      top: 48px;
      left: 0;
      width: 190px;
      background: white;
      color: #111827;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
      overflow: hidden;
      z-index: 100;
    }

    .menu.show {
      display: block;
    }

    .menu button {
      width: 100%;
      border: 0;
      background: white;
      padding: 14px;
      text-align: right;
      font-size: 15px;
      cursor: pointer;
    }

    .menu button:active {
      background: #f3f4f6;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 110px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 55px 15px 20px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      margin: auto auto 18px;
      border-radius: 22px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #6b7280;
      line-height: 1.7;
    }

    .message {
      display: flex;
      margin: 12px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #e5e7eb;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #111827;
      color: white;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 900px;
      padding: 10px 12px 14px;
      background: rgba(255,255,255,.96);
      border-top: 1px solid #e5e7eb;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 850px;
      margin: auto;
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 18px;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 16px;
      padding: 10px;
      background: transparent;
      min-width: 0;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
    }

    .send-btn {
      background: #111827;
      color: white;
    }

    .mic-btn.recording {
      background: #dc2626;
      color: white;
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      min-height: 18px;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      .header {
        height: 60px;
      }

      .chat {
        padding-top: 10px;
      }

      .welcome {
        padding-top: 40px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="logo">D</div>

      <div>
        <h1>DAB AI</h1>
        <span>مساعدك الذكي</span>
      </div>
    </div>

    <div class="menu-wrapper">

      <button
        class="menu-btn"
        id="menuBtn"
        type="button"
        aria-label="القائمة">
        ⋮
      </button>

      <div class="menu" id="menu">

        <button
          type="button"
          id="newChatBtn">
          🆕 محادثة جديدة
        </button>

        <button
          type="button"
          id="closeMenuBtn">
          ✕ إغلاق القائمة
        </button>

      </div>

    </div>

  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">

      <div class="welcome-logo">D</div>

      <h2>مرحبًا بك في DAB AI</h2>

      <p>
        مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
        اكتب رسالتك أو استخدم الميكروفون.
      </p>

    </div>

  </main>

  <div class="input-area">

    <div class="input-box">

      <button
        class="icon-btn mic-btn"
        id="micBtn"
        type="button"
        aria-label="تسجيل صوتي">
        🎙️
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="اكتب رسالتك..."
        autocomplete="off">

      <button
        class="icon-btn send-btn"
        id="sendBtn"
        type="button"
        aria-label="إرسال">
        ➤
      </button>

    </div>

    <div class="status" id="status"></div>

  </div>

</div>

<script>
"use strict";

/*
=========================================================
DAB AI
واجهة المحادثة + التعرف على الصوت الأصلي عبر Capacitor
=========================================================
*/

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const micBtn = document.getElementById("micBtn");
const sendBtn = document.getElementById("sendBtn");

const menuBtn = document.getElementById("menuBtn");
const menu = document.getElementById("menu");
const newChatBtn = document.getElementById("newChatBtn");
const closeMenuBtn = document.getElementById("closeMenuBtn");

const status = document.getElementById("status");

let recording = false;
let speechPlugin = null;


/* =====================================================
   تحميل إضافة التعرف على الصوت
   ===================================================== */

function loadSpeechPlugin() {

  try {

    if (
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.SpeechRecognition
    ) {

      speechPlugin =
        window.Capacitor.Plugins.SpeechRecognition;

      return speechPlugin;
    }

  } catch (error) {

    console.log("Speech plugin error:", error);

  }

  return null;
}


/* =====================================================
   إرسال الرسالة
   ===================================================== */

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendMessage();
  }

});

sendBtn.addEventListener("click", sendMessage);


function sendMessage() {

  const text = input.value.trim();

  if (!text) {
    return;
  }

  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  addMessage(text, "user");

  input.value = "";

  status.textContent =
    "جاري تجهيز الرد...";


  /*
  -------------------------------------------------------
  الرد الحالي تجريبي فقط.
  سنربطه لاحقًا بمحرك الذكاء الاصطناعي الحقيقي.
  -------------------------------------------------------
  */

  setTimeout(function() {

    addMessage(
      "مرحبًا! أنا DAB AI 🤖\nتم استلام رسالتك بنجاح. سنربطني لاحقًا بمحرك الذكاء الاصطناعي الحقيقي.",
      "ai"
    );

    status.textContent = "";

  }, 500);

}


/* =====================================================
   إضافة رسالة
   ===================================================== */

function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =====================================================
   محادثة جديدة
   ===================================================== */

function newChat() {

  stopRecording();

  chat.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="welcome-logo">D</div>

      <h2>مرحبًا بك في DAB AI</h2>

      <p>
        مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
        اكتب رسالتك أو استخدم الميكروفون.
      </p>

    </div>
  `;

  input.value = "";

  status.textContent = "";

  menu.classList.remove("show");

  input.focus();
}


newChatBtn.addEventListener(
  "click",
  newChat
);


/* =====================================================
   القائمة
   ===================================================== */

menuBtn.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    menu.classList.toggle("show");

  }
);


closeMenuBtn.addEventListener(
  "click",
  function() {

    menu.classList.remove("show");

  }
);


document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(".menu-wrapper")
    ) {

      menu.classList.remove("show");

    }

  }
);


/* =====================================================
   الميكروفون
   ===================================================== */

micBtn.addEventListener(
  "click",
  toggleRecording
);


async function toggleRecording() {

  if (recording) {

    await stopRecording();

    return;
  }

  await startRecording();
}


/* =====================================================
   بدء التسجيل الأصلي
   ===================================================== */

async function startRecording() {

  speechPlugin = loadSpeechPlugin();

  if (!speechPlugin) {

    status.textContent =
      "إضافة التعرف على الصوت غير موجودة داخل التطبيق.";

    return;
  }

  try {

    status.textContent =
      "جاري طلب إذن الميكروفون...";


    /*
    -----------------------------------------------------
    طلب صلاحية الميكروفون
    -----------------------------------------------------
    */

    if (
      typeof speechPlugin.requestPermissions ===
      "function"
    ) {

      await speechPlugin.requestPermissions();

    }


    /*
    -----------------------------------------------------
    التأكد من الصلاحية
    -----------------------------------------------------
    */

    if (
      typeof speechPlugin.checkPermissions ===
      "function"
    ) {

      const permissions =
        await speechPlugin.checkPermissions();

      if (
        permissions &&
        permissions.speechRecognition ===
        "denied"
      ) {

        status.textContent =
          "اسمح للتطبيق باستخدام الميكروفون من إعدادات الهاتف.";

        return;
      }

    }


    recording = true;

    micBtn.classList.add("recording");

    micBtn.textContent = "⏹️";

    status.textContent =
      "استمع إليك الآن... تحدث بوضوح.";


    /*
    -----------------------------------------------------
    بدء التعرف على الكلام
    -----------------------------------------------------
    */

    const result =
      await speechPlugin.start({

        language: "ar-DZ",

        maxResults: 1,

        prompt:
          "تحدث الآن إلى DAB AI",

        partialResults: true,

        popup: false

      });


    /*
    -----------------------------------------------------
    استقبال النتيجة
    -----------------------------------------------------
    */

    if (
      result &&
      Array.isArray(result.matches) &&
      result.matches.length > 0
    ) {

      input.value =
        result.matches[0];

      status.textContent =
        "تم التعرف على كلامك.";

    } else {

      status.textContent =
        "لم يتم التعرف على الكلام.";

    }

  } catch (error) {

    console.error(
      "Speech recognition error:",
      error
    );

    status.textContent =
      "تعذر تشغيل التعرف على الصوت. تأكد من السماح بالميكروفون.";

  } finally {

    recording = false;

    micBtn.classList.remove("recording");

    micBtn.textContent = "🎙️";

  }

}


/* =====================================================
   إيقاف التسجيل
   ===================================================== */

async function stopRecording() {

  try {

    speechPlugin =
      speechPlugin ||
      loadSpeechPlugin();

    if (
      speechPlugin &&
      typeof speechPlugin.stop ===
      "function"
    ) {

      await speechPlugin.stop();

    }

  } catch (error) {

    console.log(
      "Speech stop error:",
      error
    );

  }

  recording = false;

  micBtn.classList.remove(
    "recording"
  );

  micBtn.textContent = "🎙️";

}


/* =====================================================
   تشغيل عند فتح التطبيق
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSpeechPlugin();

  }
);

</script>

</body>
</html>
