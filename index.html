<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>DAB AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --surface: #0b0b0b;
      --surface-2: #111111;
      --surface-3: #181818;
      --border: #292929;
      --text: #ffffff;
      --muted: #9ca3af;
      --user: #202020;
      --button: #222222;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: var(--bg);
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      height: 64px;
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0
        16px;

      background: #000000;
      color: #ffffff;

      border-bottom: 1px solid var(--border);

      padding-top: env(safe-area-inset-top);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;

      border-radius: 12px;

      background: #ffffff;
      color: #000000;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
      font-weight: bold;
    }

    .brand h1 {
      font-size: 20px;
      color: #ffffff;
    }

    .brand span {
      display: block;

      font-size: 11px;
      color: #9ca3af;

      margin-top: 2px;
    }

    /* =========================
       MENU
       ========================= */

    .menu-wrapper {
      position: relative;
    }

    .menu-btn {
      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 50%;

      background: transparent;
      color: #ffffff;

      font-size: 24px;
      cursor: pointer;
    }

    .menu-btn:active {
      background: #1f1f1f;
    }

    .menu {
      display: none;

      position: absolute;

      top: 48px;
      left: 0;

      width: 200px;

      background: #151515;
      color: #ffffff;

      border: 1px solid #2a2a2a;
      border-radius: 14px;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);

      overflow: hidden;

      z-index: 1000;
    }

    .menu.show {
      display: block;
    }

    .menu button {
      width: 100%;

      border: 0;

      background: #151515;
      color: #ffffff;

      padding: 15px;

      text-align: right;

      font-size: 15px;

      cursor: pointer;
    }

    .menu button:active {
      background: #252525;
    }

    /* =========================
       CHAT
       ========================= */

    .chat {
      flex: 1;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 20px 14px 125px;

      scroll-behavior: smooth;

      background: #000000;

      -webkit-overflow-scrolling: touch;
    }

    .chat::-webkit-scrollbar {
      width: 5px;
    }

    .chat::-webkit-scrollbar-track {
      background: #000000;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #292929;
      border-radius: 10px;
    }

    /* =========================
       WELCOME
       ========================= */

    .welcome {
      text-align: center;

      padding:
        55px
        15px
        20px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;

      margin:
        auto
        auto
        18px;

      border-radius: 22px;

      background: #ffffff;
      color: #000000;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
      font-weight: bold;

      box-shadow:
        0 0 30px rgba(255, 255, 255, 0.08);
    }

    .welcome h2 {
      color: #ffffff;

      font-size: 26px;

      margin-bottom: 10px;
    }

    .welcome p {
      color: #9ca3af;

      line-height: 1.8;
    }

    /* =========================
       MESSAGES
       ========================= */

    .message {
      display: flex;

      margin: 12px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;

      padding: 12px 15px;

      border-radius: 17px;

      line-height: 1.7;

      white-space: pre-wrap;
      word-wrap: break-word;

      border: 1px solid transparent;
    }

    .user .bubble {
      background: var(--user);
      color: #ffffff;

      border-color: #2d2d2d;

      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #ffffff;
      color: #000000;

      border-bottom-left-radius: 5px;
    }

    /* =========================
       INPUT AREA
       ========================= */

    .input-area {
      position: fixed;

      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      width: 100%;
      max-width: 900px;

      padding:
        10px
        12px
        calc(14px + env(safe-area-inset-bottom));

      background: rgba(0, 0, 0, 0.97);

      border-top: 1px solid var(--border);

      z-index: 500;
    }

    .input-box {
      display: flex;

      align-items: center;

      gap: 8px;

      max-width: 850px;

      margin: auto;

      padding: 6px;

      border:
        1px solid
        #303030;

      border-radius: 18px;

      background: #101010;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      border: 0;
      outline: none;

      font-size: 16px;

      padding: 10px;

      background: transparent;
      color: #ffffff;

      direction: rtl;
    }

    #messageInput::placeholder {
      color: #777777;
    }

    #messageInput:focus {
      outline: none;
    }

    /* =========================
       BUTTONS
       ========================= */

    .icon-btn {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border: 0;
      border-radius: 50%;

      cursor: pointer;

      font-size: 19px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--button);
      color: #ffffff;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .send-btn {
      background: #ffffff;
      color: #000000;
    }

    .send-btn:active {
      background: #dddddd;
    }

    .mic-btn {
      background: #222222;
      color: #ffffff;
    }

    .mic-btn.recording {
      background: #ffffff;
      color: #000000;

      animation: micPulse 1.1s infinite;
    }

    @keyframes micPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    /* =========================
       STATUS
       ========================= */

    .status {
      text-align: center;

      font-size: 12px;

      color: #8b8b8b;

      min-height: 18px;

      margin-top: 5px;

      line-height: 1.5;
    }

    .status.active {
      color: #ffffff;
    }

    .status.error {
      color: #bbbbbb;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {
      .header {
        height: 60px;
        min-height: 60px;
      }

      .chat {
        padding-top: 10px;
      }

      .welcome {
        padding-top: 40px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .bubble {
        max-width: 88%;
      }

      .brand h1 {
        font-size: 18px;
      }

      .brand span {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
       ========================= -->

  <header class="header">

    <div class="brand">

      <div class="logo">D</div>

      <div>
        <h1>DAB AI</h1>
        <span>مساعدك الذكي</span>
      </div>

    </div>

    <div class="menu-wrapper">

      <button
        class="menu-btn"
        id="menuBtn"
        type="button"
        aria-label="القائمة">
        ⋮
      </button>

      <div
        class="menu"
        id="menu">

        <button
          type="button"
          id="newChatBtn">
          🆕 محادثة جديدة
        </button>

        <button
          type="button"
          id="closeMenuBtn">
          ✕ إغلاق القائمة
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       CHAT
       ========================= -->

  <main
    class="chat"
    id="chat">

    <div
      class="welcome"
      id="welcome">

      <div class="welcome-logo">D</div>

      <h2>
        مرحبًا بك في DAB AI
      </h2>

      <p>
        مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
        اكتب رسالتك أو استخدم الميكروفون.
      </p>

    </div>

  </main>


  <!-- =========================
       INPUT
       ========================= -->

  <div class="input-area">

    <div class="input-box">

      <button
        class="icon-btn mic-btn"
        id="micBtn"
        type="button"
        aria-label="تسجيل صوتي">
        🎙️
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="اكتب رسالتك..."
        autocomplete="off"
        enterkeyhint="send">

      <button
        class="icon-btn send-btn"
        id="sendBtn"
        type="button"
        aria-label="إرسال">
        ➤
      </button>

    </div>

    <div
      class="status"
      id="status"
      aria-live="polite">
    </div>

  </div>

</div>


<script>
"use strict";

/*
=========================================================
 DAB AI
 الواجهة السوداء + المحادثة + التعرف على الصوت
 عبر Capacitor Speech Recognition

 مهم:
 لا يوجد هنا API وهمي للذكاء الاصطناعي.
 الرد الحالي تجريبي كما في المشروع الأصلي.
=========================================================
*/


/* =====================================================
   العناصر
   ===================================================== */

const input =
  document.getElementById("messageInput");

const chat =
  document.getElementById("chat");

const micBtn =
  document.getElementById("micBtn");

const sendBtn =
  document.getElementById("sendBtn");

const menuBtn =
  document.getElementById("menuBtn");

const menu =
  document.getElementById("menu");

const newChatBtn =
  document.getElementById("newChatBtn");

const closeMenuBtn =
  document.getElementById("closeMenuBtn");

const status =
  document.getElementById("status");


/* =====================================================
   المتغيرات
   ===================================================== */

let recording = false;

let speechPlugin = null;


/* =====================================================
   تغيير حالة الرسالة أسفل الإدخال
   ===================================================== */

function setStatus(
  message,
  type = ""
) {

  status.textContent =
    message || "";

  status.classList.remove(
    "active",
    "error"
  );

  if (type) {
    status.classList.add(type);
  }
}


/* =====================================================
   تحميل إضافة التعرف على الصوت
   ===================================================== */

function loadSpeechPlugin() {

  try {

    if (
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.SpeechRecognition
    ) {

      speechPlugin =
        window.Capacitor.Plugins.SpeechRecognition;

      return speechPlugin;
    }

  } catch (error) {

    console.error(
      "Speech plugin loading error:",
      error
    );

  }

  return null;
}


/* =====================================================
   هل إضافة الصوت موجودة؟
   ===================================================== */

function ensureSpeechPlugin() {

  if (speechPlugin) {
    return speechPlugin;
  }

  return loadSpeechPlugin();
}


/* =====================================================
   إرسال الرسالة
   ===================================================== */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  }
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }


  addMessage(
    text,
    "user"
  );


  input.value = "";

  setStatus(
    "جاري تجهيز الرد..."
  );


  /*
  -------------------------------------------------------
  الرد الحالي تجريبي فقط.
  لن نضع API وهميًا هنا.
  -------------------------------------------------------
  */

  setTimeout(
    function() {

      addMessage(
        "مرحبًا! أنا DAB AI 🤖\nتم استلام رسالتك بنجاح. سنربطني لاحقًا بمحرك الذكاء الاصطناعي الحقيقي.",
        "ai"
      );

      setStatus("");

    },
    500
  );

}


/* =====================================================
   إضافة رسالة
   ===================================================== */

function addMessage(
  text,
  type
) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  message.appendChild(
    bubble
  );


  chat.appendChild(
    message
  );


  requestAnimationFrame(
    function() {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =====================================================
   محادثة جديدة
   ===================================================== */

function newChat() {

  stopRecording();

  chat.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="welcome-logo">D</div>

      <h2>
        مرحبًا بك في DAB AI
      </h2>

      <p>
        مساعدك الذكي للمحادثة والإجابة عن أسئلتك.<br>
        اكتب رسالتك أو استخدم الميكروفون.
      </p>

    </div>
  `;


  input.value = "";

  setStatus("");

  menu.classList.remove(
    "show"
  );

  setTimeout(
    function() {
      input.focus();
    },
    100
  );

}


newChatBtn.addEventListener(
  "click",
  newChat
);


/* =====================================================
   القائمة
   ===================================================== */

menuBtn.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    menu.classList.toggle(
      "show"
    );

  }
);


closeMenuBtn.addEventListener(
  "click",
  function() {

    menu.classList.remove(
      "show"
    );

  }
);


document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".menu-wrapper"
      )
    ) {

      menu.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   الميكروفون
   ===================================================== */

micBtn.addEventListener(
  "click",
  toggleRecording
);


async function toggleRecording() {

  if (recording) {

    await stopRecording();

    return;
  }

  await startRecording();

}


/* =====================================================
   تحويل خطأ الصوت إلى رسالة مفهومة
   ===================================================== */

function getSpeechErrorMessage(
  error
) {

  const code =
    error &&
    (
      error.code ||
      error.message ||
      error.error
    );

  const text =
    String(
      code || ""
    ).toLowerCase();


  if (
    text.includes("permission") ||
    text.includes("denied") ||
    text.includes("not allowed")
  ) {

    return (
      "الميكروفون غير مسموح به. " +
      "اسمح للتطبيق باستخدام الميكروفون من إعدادات الهاتف."
    );

  }


  if (
    text.includes("network")
  ) {

    return (
      "تعذر الاتصال بخدمة التعرف على الكلام. " +
      "تأكد من اتصال الهاتف بالإنترنت."
    );

  }


  if (
    text.includes("language")
  ) {

    return (
      "لغة التعرف على الكلام غير متاحة على هذا الجهاز."
    );

  }


  if (
    text.includes("audio") ||
    text.includes("record")
  ) {

    return (
      "تعذر الوصول إلى الميكروفون. " +
      "تأكد أن الميكروفون غير مستخدم من تطبيق آخر."
    );

  }


  return (
    "تعذر تشغيل التعرف على الصوت. " +
    "تأكد من السماح بالميكروفون ثم حاول مرة أخرى."
  );

}


/* =====================================================
   بدء التسجيل
   ===================================================== */

async function startRecording() {

  const plugin =
    ensureSpeechPlugin();


  if (!plugin) {

    setStatus(
      "إضافة التعرف على الصوت غير موجودة داخل التطبيق.",
      "error"
    );

    return;
  }


  if (recording) {
    return;
  }


  try {

    setStatus(
      "جاري التحقق من صلاحية الميكروفون...",
      "active"
    );


    /* -----------------------------------------------
       طلب الصلاحية
       ----------------------------------------------- */

    if (
      typeof plugin.requestPermissions ===
      "function"
    ) {

      await plugin.requestPermissions();

    }


    /* -----------------------------------------------
       فحص الصلاحية
       ----------------------------------------------- */

    if (
      typeof plugin.checkPermissions ===
      "function"
    ) {

      const permissions =
        await plugin.checkPermissions();


      console.log(
        "Speech permissions:",
        permissions
      );


      const speechPermission =
        permissions &&
        permissions.speechRecognition;


      if (
        speechPermission === "denied"
      ) {

        setStatus(
          "تم رفض الميكروفون. اسمح للتطبيق باستخدام الميكروفون من إعدادات الهاتف.",
          "error"
        );

        return;
      }

    }


    /* -----------------------------------------------
       تشغيل حالة التسجيل
       ----------------------------------------------- */

    recording = true;

    micBtn.classList.add(
      "recording"
    );

    micBtn.textContent =
      "⏹️";

    micBtn.setAttribute(
      "aria-label",
      "إيقاف التسجيل"
    );


    setStatus(
      "🎙️ استمع إليك الآن... تحدث بوضوح.",
      "active"
    );


    /* -----------------------------------------------
       بدء التعرف
       ----------------------------------------------- */

    const result =
      await plugin.start({

        language: "ar-DZ",

        maxResults: 1,

        prompt:
          "تحدث الآن إلى DAB AI",

        partialResults: true,

        popup: false

      });


    console.log(
      "Speech result:",
      result
    );


    /* -----------------------------------------------
       قراءة النتيجة
       ----------------------------------------------- */

    if (
      result &&
      Array.isArray(
        result.matches
      ) &&
      result.matches.length > 0
    ) {

      const recognizedText =
        String(
          result.matches[0] || ""
        ).trim();


      if (recognizedText) {

        input.value =
          recognizedText;


        setStatus(
          "✓ تم التعرف على كلامك.",
          "active"
        );


        input.focus();

      } else {

        setStatus(
          "لم يصل نص واضح من الميكروفون. حاول التحدث مرة أخرى.",
          "error"
        );

      }

    } else {

      setStatus(
        "لم يصل نص من التعرف على الكلام. تحدث بوضوح وحاول مرة أخرى.",
        "error"
      );

    }


  } catch (error) {

    console.error(
      "Speech recognition error:",
      error
    );


    setStatus(
      getSpeechErrorMessage(
        error
      ),
      "error"
    );

  } finally {

    recording = false;

    micBtn.classList.remove(
      "recording"
    );

    micBtn.textContent =
      "🎙️";

    micBtn.setAttribute(
      "aria-label",
      "تسجيل صوتي"
    );

  }

}


/* =====================================================
   إيقاف التسجيل
   ===================================================== */

async function stopRecording() {

  try {

    const plugin =
      speechPlugin ||
      ensureSpeechPlugin();


    if (
      plugin &&
      typeof plugin.stop ===
      "function"
    ) {

      await plugin.stop();

    }

  } catch (error) {

    console.log(
      "Speech stop error:",
      error
    );

  }


  recording = false;

  micBtn.classList.remove(
    "recording"
  );

  micBtn.textContent =
    "🎙️";

  micBtn.setAttribute(
    "aria-label",
    "تسجيل صوتي"
  );

}


/* =====================================================
   عند فتح التطبيق
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSpeechPlugin();

    setStatus("");

  }
);


/* =====================================================
   منع أخطاء غير متوقعة من تعطيل الواجهة
   ===================================================== */

window.addEventListener(
  "error",
  function(event) {

    console.error(
      "DAB AI error:",
      event.error || event.message
    );

  }
);

</script>

</body>
</html>
