name: Build DAB AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Initialize Capacitor
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Check APK
        run: |
          echo "===== APK ====="
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "===== FILE ====="
          file android/app/build/outputs/apk/debug/app-debug.apk
          echo "===== SIGNATURE ====="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          echo "===== PACKAGE INFO ====="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAB-AI-APK-Android13
          path: android/app/build/outputs/apk/debug/app-debug.apk
