name: Build DAB AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Initialize Capacitor
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure signed release
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """

          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {" + signing, 1)

          text = text.replace(
              "release {",
              """release {
                      signingConfig signingConfigs.release""",
              1
          )

          path.write_text(text)
          PY

      - name: Build signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/release/
          file android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAB-AI-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
